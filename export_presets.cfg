html/head_include="<script>\n(() => {\n  if (window.fxDiagnostics) return;\n  const key = 'fx-crossroads-diagnostics-v72';\n  let enabled = window.fxDiagnosticsEnabled !== false;\n  let previous = null;\n  try { previous = JSON.parse(localStorage.getItem(key) || 'null'); } catch (_) {}\n  const report = {version:'v180-long-journey', started:new Date().toISOString(), browser:navigator.userAgent,\n    previous: previous ? {started:previous.started, latest:previous.latest, events:Array.isArray(previous.events)?previous.events.slice(-12):[]} : null,\n    latest:{}, graphics:{}, device:{cores:navigator.hardwareConcurrency || null, memoryGB:navigator.deviceMemory || null}, events:[]};\n  function graphics() {\n    if (Object.keys(report.graphics).length) return;\n    const canvas=document.querySelector('canvas'); if(!canvas)return;\n    try { const gl=canvas.getContext('webgl2'); if(!gl || gl.isContextLost())return;\n      const ext=gl.getExtension('WEBGL_debug_renderer_info');\n      report.graphics={version:gl.getParameter(gl.VERSION),renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),maxTextureSize:gl.getParameter(gl.MAX_TEXTURE_SIZE),width:gl.drawingBufferWidth,height:gl.drawingBufferHeight};\n    } catch (_) {}\n  }\n  function persist() { try { localStorage.setItem(key,JSON.stringify(report)); } catch (_) {} }\n  function event(kind,message) { if (!enabled) return; report.events.push({time:new Date().toISOString(),kind,message:String(message).slice(0,1200)}); if(report.events.length>80)report.events.shift(); persist(); }\n  function download() { const a=document.createElement('a');const u=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.href=u;a.download='crossroads-diagnostics.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000); }\n  window.fxDiagnostics={sample(value){if(!enabled)return;graphics();report.latest=value;if(performance.memory)report.latest.jsHeapBytes=performance.memory.usedJSHeapSize;persist();},set_enabled(value){enabled=!!value;},download,inspect(){graphics();return {browser:report.browser,graphics:report.graphics,device:report.device};}};\n  window.addEventListener('error',e=>event('javascript-error',e.message));\n  window.addEventListener('unhandledrejection',e=>event('promise-error',e.reason));\n  const original=console.error.bind(console);\n  console.error=(...args)=>{original(...args);event('engine-error',args.map(String).join(' '));};\n  document.addEventListener('webglcontextlost', (e) => {\n    const activity=window.fxAnonymousActivity;\n    if(activity && window.fxAnonymousActivityEnabled !== false){\n      try{const p={...activity.packet,event:Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join(''),seconds:0,active:0,duration:0,kind:'graphics_loss',result:'interrupted'};\n        fetch(activity.endpoint+'/activity/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),keepalive:true}).catch(()=>{});\n      }catch(_){}\n    }\n    event('webgl-context-lost',e.statusMessage || 'Browser graphics context lost. This does not prove the computer lacks WebGL2.');\n    if(document.getElementById('fx-context-lost'))return;\n    const p=document.createElement('div');p.id='fx-context-lost';p.style.cssText='position:fixed;inset:15% 8%;z-index:2147483647;background:#142b32;color:white;padding:24px;border:3px solid #e9c58b;font:18px sans-serif;';\n    p.textContent='The browser lost its graphics connection. Save the diagnostic report below before restarting Chrome. If this repeats, try the Windows edition and give the report to your teacher. ';\n    const b=document.createElement('button');b.textContent='Download diagnostic report';b.style.cssText='font:18px sans-serif;padding:14px;margin-top:20px;';b.onclick=download;p.append(b);document.body.append(p);\n  },true);\n  document.addEventListener('webglcontextrestored',()=>event('webgl-context-restored','Browser restored graphics context.'),true);\n  window.addEventListener('pagehide',()=>event('page-hidden','Tab closed, reloaded or navigated away; not necessarily a crash.'));\n  event('boot','Diagnostic reports stay on this device; anonymous activity counts are separate.');\n})();\n\n</script>\n<script>\n/* Diagnostic timing only. No GPU queries, readback, player data or game-loop waits. */\n(()=>{\n 'use strict';\n if(window.fxFrameTiming)return;\n let previous=0,rafMax=0,rafSlow=0,longMax=0,longTotal=0,longCount=0,visibilityChanges=0,hiddenSince=document.hidden?performance.now():null,hiddenTotal=0;\n const frame=now=>{if(previous){const gap=now-previous;rafMax=Math.max(rafMax,gap);if(gap>50)rafSlow++;}previous=now;requestAnimationFrame(frame);};\n requestAnimationFrame(frame);\n let longTasksSupported=false;\n if(typeof PerformanceObserver==='function')try{const observer=new PerformanceObserver(list=>{for(const e of list.getEntries()){longMax=Math.max(longMax,e.duration);longTotal+=e.duration;longCount++;}});observer.observe({type:'longtask',buffered:false});longTasksSupported=true;}catch{}\n document.addEventListener('visibilitychange',()=>{visibilityChanges++;const now=performance.now();if(document.hidden){hiddenSince=now;}else if(hiddenSince!==null){hiddenTotal+=now-hiddenSince;hiddenSince=null;}});\n window.fxFrameTiming={sample(){const now=performance.now(),value={hidden:document.hidden,visibility_changes:visibilityChanges,hidden_total_ms:Math.round(hiddenTotal+(hiddenSince===null?0:now-hiddenSince)),raf_gap_max_ms:Math.round(rafMax),raf_over_50ms:rafSlow,long_tasks_supported:longTasksSupported,long_task_max_ms:Math.round(longMax),long_task_total_ms:Math.round(longTotal),long_task_count:longCount};rafMax=0;rafSlow=0;longMax=0;longTotal=0;longCount=0;return value;}};\n})();\n\n</script>\n<script>\nwindow.addEventListener(\"DOMContentLoaded\",()=>{\n/* Bounded asynchronous diagnostics. Never awaited by the game loop. */\n(()=>{\n 'use strict';\n let enabled=window.fxAnonymousActivityEnabled!==false;\n let session=null,samples=[],queue=[],busy=false,status='Not in a match',lastSend=0,lost=0;\n let device;try{device=localStorage.getItem('fx-test-device-v1');if(!device){device=crypto.randomUUID();localStorage.setItem('fx-test-device-v1',device);}}catch{device=crypto.randomUUID();}\n const badge=document.createElement('button');badge.id='fx-report-status';badge.style.cssText='position:fixed;top:3px;right:3px;z-index:10;background:#142b32dd;color:#cce4e8;border:1px solid #45616b;border-radius:4px;font:11px system-ui;padding:4px 7px;';badge.title='Send the current diagnostic batch. No names or account details are collected.';badge.textContent='Reports: not in a match';badge.onclick=()=>flush('manual');document.body.append(badge);badge.hidden=true;\n function show(s){status=s;badge.hidden=!session;badge.textContent='Reports: '+s+(session?' · '+session.room:'');}\n function batch(reason){if(!enabled||!session||session.enabled===false||!samples.length)return;const selected=samples.splice(0,15);let graphics={};try{const r=window.fxDiagnostics?.inspect()||{};graphics={...(r.graphics||r),hardwareConcurrency:navigator.hardwareConcurrency||0,deviceMemory:navigator.deviceMemory||0};}catch{}queue.push({session:{...session},body:{id:crypto.randomUUID(),match_id:session.match_id,device_id:device,build:'V182-preview',hero:selected.at(-1)?.hero||'',reason,samples:selected,graphics}});if(queue.length>6){queue.shift();lost++;}}\n async function send(){\n  if(!enabled||busy||!queue.length||Date.now()-lastSend<1000)return;busy=true;lastSend=Date.now();const item=queue[0];\n  try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);let r;try{r=await fetch(item.session.endpoint+'/reports/ingest',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+item.session.token},body:JSON.stringify(item.body),signal:controller.signal,keepalive:false});}finally{clearTimeout(timer);}if(r.ok){queue.shift();show(lost?'saved · '+lost+' batches dropped':'saved');}else if(r.status===401||r.status===400||r.status===413){queue.shift();show(r.status===401?'ticket expired · rejoin match':'batch rejected · download F8 report');}else show(r.status===503?'database unavailable · F8 still works':'waiting to retry');}catch{show('offline · waiting to retry');}finally{busy=false;}\n }\n function flush(reason='interval'){batch(reason);send();}\n window.fxReports={set_enabled(value){enabled=!!value;if(!enabled){samples=[];queue=[];show(\"disabled\");}},start(config){if(session?.match_id===config.match_id){session={...config};return;}if(session)batch('new-match');session={...config,endpoint:config.endpoint.replace(/\\/$/,'')};samples=[];show(config.enabled===false?'not configured · F8 still works':'collecting');},sample(sample){if(!enabled||!session||session.enabled===false||sample.match_id!==session.match_id||!sample.players)return;if(sample.active===false){if(!session.complete){session.complete=true;flush('match-complete');}return;}samples.push(sample);if(samples.length>45){samples.shift();lost++;}if(sample.graphics_context_lost)flush('graphics-loss');},flush,inspect(){return {status,pending_batches:queue.length,pending_samples:samples.length,dropped:lost,match_id:session?.match_id||''};}};\n setInterval(()=>flush(),15000);\n document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush('hidden');});\n window.addEventListener('pagehide',()=>{batch('pagehide');const item=queue[0];if(!item)return;const body=JSON.stringify(item.body);if(new TextEncoder().encode(body).length<60000)fetch(item.session.endpoint+'/reports/ingest',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+item.session.token},body,keepalive:true}).catch(()=>{});});\n document.addEventListener('webglcontextlost',()=>flush('graphics-loss'),true);\n})();\n\n});\n</script>\n"

